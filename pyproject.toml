[project]
name = "footy-quiz"
version = "0.1.0"
description = "Football quiz: deterministic riddle generation + live RAG hints"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
