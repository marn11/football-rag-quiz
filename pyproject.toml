[project]
name = "footy-quiz"
version = "0.1.0"
description = "Football quiz: deterministic riddle generation + live RAG hints"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11.0",
    "duckdb>=1.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pysbd>=0.3.4",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
